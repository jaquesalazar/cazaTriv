{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Categorías - CazaTriv</title>
  <link rel="stylesheet" href="{% static 'apptriv/styles.css' %}">
</head>
<body>
  <div class="container">
    <h2>Selecciona una categoría</h2>
    <ul>
      {% for c in categorias %}
        <li><a href="{% url 'jugar' c %}">{{ c }}</a></li>
      {% endfor %}
    </ul>
    <a href="/" class="btn">Volver al inicio</a>
  </div>
</body>
</html>
